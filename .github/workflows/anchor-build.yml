name: Build Anchor learning program

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/anchor-build.yml
      - learning/anchor/**
      - scripts/learning/normalize-built-idl.mjs

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Solana and Anchor
        uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: 2.2.20
          anchor_version: 1.2.0
      - name: Restore program keypair for the declared Program ID
        env:
          LEARNING_PROGRAM_KEYPAIR: ${{ secrets.LEARNING_PROGRAM_KEYPAIR }}
        run: |
          test -n "$LEARNING_PROGRAM_KEYPAIR"
          mkdir -p learning/anchor/target/deploy
          printf '%s' "$LEARNING_PROGRAM_KEYPAIR" > learning/anchor/target/deploy/antimatter_learning-keypair.json
          chmod 600 learning/anchor/target/deploy/antimatter_learning-keypair.json
          test "$(solana-keygen pubkey learning/anchor/target/deploy/antimatter_learning-keypair.json)" = "24HLBRfv1vZsty1w9A27qn1QgQJDtbQGbU9HC1fqwk9B"
      - name: Build SBF program and IDL
        working-directory: learning/anchor
        run: anchor build
      - name: Verify and normalize generated IDL address
        run: node scripts/learning/normalize-built-idl.mjs learning/anchor/target "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antimatter-learning-sbf
          path: |
            learning/build/antimatter_learning.so
            learning/idl/antimatter_learning.json
            verification/learning-sbf-build.json
          if-no-files-found: error
